<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Arcade</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #0a0a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Press Start 2P', cursive;
            position: relative;
            padding: 40px 20px;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Scanline overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15) 0px,
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 1000;
        }

        /* Animated stars background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite;
            opacity: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: var(--max-opacity); }
        }

        /* Grid background */
        .grid-bg {
            position: fixed;
            bottom: 0;
            left: -10%;
            width: 120%;
            height: 40%;
            background:
                linear-gradient(to bottom, transparent 0%, rgba(138, 43, 226, 0.1) 100%);
            transform: perspective(500px) rotateX(60deg);
            transform-origin: bottom;
            background-image:
                linear-gradient(rgba(138, 43, 226, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(138, 43, 226, 0.3) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridScroll 2s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridScroll {
            0% { background-position: 0 0; }
            100% { background-position: 0 50px; }
        }

        .container {
            text-align: center;
            z-index: 10;
            width: 100%;
            max-width: 1000px;
            position: relative;
        }

        .title-wrapper {
            margin-bottom: 50px;
            padding-top: 20px;
        }

        .title {
            font-size: 2.5rem;
            color: #fff;
            text-shadow:
                0 0 10px #ff00de,
                0 0 20px #ff00de,
                0 0 40px #ff00de,
                0 0 80px #ff00de;
            animation: titleGlow 2s ease-in-out infinite alternate;
            letter-spacing: 4px;
        }

        @keyframes titleGlow {
            from {
                text-shadow:
                    0 0 10px #ff00de,
                    0 0 20px #ff00de,
                    0 0 40px #ff00de,
                    0 0 80px #ff00de;
            }
            to {
                text-shadow:
                    0 0 5px #ff6bef,
                    0 0 10px #ff00de,
                    0 0 20px #ff00de,
                    0 0 40px #ff00de;
            }
        }

        .subtitle {
            font-size: 0.7rem;
            color: #00ffff;
            margin-top: 15px;
            letter-spacing: 6px;
            text-transform: uppercase;
            animation: subtitleBlink 3s ease-in-out infinite;
        }

        @keyframes subtitleBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            padding: 0 10px;
        }

        .game-card {
            position: relative;
            background: linear-gradient(135deg, rgba(20, 20, 60, 0.9), rgba(40, 10, 60, 0.9));
            border: 2px solid rgba(138, 43, 226, 0.5);
            border-radius: 12px;
            padding: 30px 20px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff00de, #00ffff, #ff00de, #00ffff);
            border-radius: 12px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
            background-size: 300% 300%;
            animation: borderGradient 3s ease infinite;
        }

        @keyframes borderGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .game-card:hover::before {
            opacity: 1;
        }

        .game-card::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            background: linear-gradient(135deg, rgba(20, 20, 60, 0.95), rgba(40, 10, 60, 0.95));
            border-radius: 10px;
            z-index: -1;
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow:
                0 10px 40px rgba(138, 43, 226, 0.4),
                0 0 20px rgba(255, 0, 222, 0.2);
        }

        .game-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: block;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
            transition: transform 0.3s ease;
        }

        .game-card:hover .game-icon {
            transform: scale(1.2) rotate(5deg);
            animation: iconBounce 0.5s ease;
        }

        @keyframes iconBounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.3) rotate(-5deg); }
            100% { transform: scale(1.2) rotate(5deg); }
        }

        .game-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.75rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            line-height: 1.6;
        }

        .game-card:nth-child(1) .game-title { color: #ff6b6b; }
        .game-card:nth-child(2) .game-title { color: #ffd93d; }
        .game-card:nth-child(3) .game-title { color: #6bcb77; }
        .game-card:nth-child(4) .game-title { color: #4d96ff; }
        .game-card:nth-child(5) .game-title { color: #ff6bef; }

        .game-card:nth-child(1):hover { border-color: #ff6b6b; box-shadow: 0 10px 40px rgba(255, 107, 107, 0.3), 0 0 20px rgba(255, 107, 107, 0.2); }
        .game-card:nth-child(2):hover { border-color: #ffd93d; box-shadow: 0 10px 40px rgba(255, 217, 61, 0.3), 0 0 20px rgba(255, 217, 61, 0.2); }
        .game-card:nth-child(3):hover { border-color: #6bcb77; box-shadow: 0 10px 40px rgba(107, 203, 119, 0.3), 0 0 20px rgba(107, 203, 119, 0.2); }
        .game-card:nth-child(4):hover { border-color: #4d96ff; box-shadow: 0 10px 40px rgba(77, 150, 255, 0.3), 0 0 20px rgba(77, 150, 255, 0.2); }
        .game-card:nth-child(5):hover { border-color: #ff6bef; box-shadow: 0 10px 40px rgba(255, 107, 239, 0.3), 0 0 20px rgba(255, 107, 239, 0.2); }

        .play-hint {
            display: block;
            font-size: 0.45rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 12px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .game-card:hover .play-hint {
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .footer {
            margin-top: 50px;
            padding-bottom: 20px;
            z-index: 10;
        }

        .coin-text {
            font-size: 0.55rem;
            color: #ffd93d;
            animation: coinBlink 1s step-end infinite;
            letter-spacing: 2px;
        }

        @keyframes coinBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Floating pixels decoration */
        .pixels-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        .pixel {
            position: absolute;
            width: 4px;
            height: 4px;
            pointer-events: none;
            animation: floatUp var(--float-duration) linear infinite;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-20px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Scroll indicator */
        .scroll-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            animation: bounce 2s ease-in-out infinite;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .scroll-indicator.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .scroll-indicator span {
            display: block;
            font-size: 0.5rem;
            color: #00ffff;
            letter-spacing: 2px;
        }

        .scroll-indicator::after {
            content: '▼';
            display: block;
            text-align: center;
            color: #00ffff;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(10px); }
        }

        @media (max-width: 600px) {
            .title {
                font-size: 1.3rem;
                letter-spacing: 2px;
            }

            .games-grid {
                grid-template-columns: 1fr;
            }

            .game-card {
                padding: 25px 15px;
            }

            .subtitle {
                font-size: 0.45rem;
                letter-spacing: 3px;
            }

            .coin-text {
                font-size: 0.45rem;
            }

            body {
                padding: 30px 15px;
            }

            .title-wrapper {
                margin-bottom: 30px;
            }
        }

        @media (min-width: 601px) and (max-width: 900px) {
            .games-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .title {
                font-size: 2rem;
            }
        }

        /* Ensure touch scrolling works smoothly on iOS */
        @supports (-webkit-touch-callout: none) {
            body {
                -webkit-overflow-scrolling: touch;
            }
        }
    </style>
</head>
<body>
    <!-- Stars background -->
    <div class="stars" id="stars"></div>

    <!-- Grid floor -->
    <div class="grid-bg"></div>

    <!-- Floating pixels -->
    <div class="pixels-container" id="pixels"></div>

    <!-- Scroll indicator -->
    <div class="scroll-indicator" id="scrollIndicator">
        <span>SCROLL</span>
    </div>

    <div class="container">
        <div class="title-wrapper">
            <h1 class="title">RETRO ARCADE</h1>
            <p class="subtitle">⬤ Select your game ⬤</p>
        </div>

        <div class="games-grid">
            <a href="bomberman.html" class="game-card">
                <span class="game-icon">💣</span>
                <span class="game-title">Bomberman</span>
                <span class="play-hint">► PLAY</span>
            </a>

            <a href="match3.html" class="game-card">
                <span class="game-icon">💎</span>
                <span class="game-title">Match-3</span>
                <span class="play-hint">► PLAY</span>
            </a>

            <a href="nut-sort.html" class="game-card">
                <span class="game-icon">🔩</span>
                <span class="game-title">Nut Sorter</span>
                <span class="play-hint">► PLAY</span>
            </a>

            <a href="slots.html" class="game-card">
                <span class="game-icon">🎰</span>
                <span class="game-title">Slots</span>
                <span class="play-hint">► PLAY</span>
            </a>

            <a href="zen-coloring.html" class="game-card">
                <span class="game-icon">🎨</span>
                <span class="game-title">Zen Coloring</span>
                <span class="play-hint">► PLAY</span>
            </a>
        </div>

        <div class="footer">
            <p class="coin-text">INSERT COIN TO CONTINUE</p>
        </div>
    </div>

    <script>
        // Generate stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            star.style.setProperty('--max-opacity', Math.random() * 0.7 + 0.3);
            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.width = Math.random() > 0.8 ? '3px' : '2px';
            star.style.height = star.style.width;
            starsContainer.appendChild(star);
        }

        // Generate floating pixels
        const pixelsContainer = document.getElementById('pixels');
        const colors = ['#ff00de', '#00ffff', '#ffd93d', '#ff6b6b', '#6bcb77', '#4d96ff'];
        for (let i = 0; i < 20; i++) {
            const pixel = document.createElement('div');
            pixel.className = 'pixel';
            pixel.style.left = Math.random() * 100 + '%';
            pixel.style.background = colors[Math.floor(Math.random() * colors.length)];
            pixel.style.setProperty('--float-duration', (Math.random() * 10 + 8) + 's');
            pixel.style.animationDelay = Math.random() * 15 + 's';
            pixel.style.boxShadow = `0 0 6px ${pixel.style.background}`;
            pixelsContainer.appendChild(pixel);
        }

        // Hide scroll indicator when user scrolls or if page doesn't need scrolling
        const scrollIndicator = document.getElementById('scrollIndicator');

        function checkScroll() {
            const scrollable = document.body.scrollHeight > window.innerHeight;
            const scrolled = window.scrollY > 50;

            if (!scrollable || scrolled) {
                scrollIndicator.classList.add('hidden');
            } else {
                scrollIndicator.classList.remove('hidden');
            }
        }

        window.addEventListener('scroll', checkScroll);
        window.addEventListener('resize', checkScroll);
        checkScroll();
    </script>
</body>
</html>
